<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 76 376 336" fill="none" role="img" aria-label="SiddhTech Solutions">
  <defs>
    <!-- Black metallic gradients -->
    <linearGradient id="blackMain" x1="120" y1="140" x2="340" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A4A4A" />
      <stop offset="22%" stop-color="#262626" />
      <stop offset="45%" stop-color="#0A0A0A" />
      <stop offset="68%" stop-color="#303030" />
      <stop offset="88%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="blackBevel" x1="140" y1="150" x2="290" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E2E2E" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="100%" stop-color="#3A3A3A" />
    </linearGradient>

    <linearGradient id="blackWedgeLight" x1="110" y1="395" x2="175" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D3D3D" />
      <stop offset="60%" stop-color="#1C1C1C" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <linearGradient id="blackWedgeDark" x1="110" y1="395" x2="200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Orange gradients -->
    <linearGradient id="orangeRibbon" x1="95" y1="220" x2="310" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB27A" />
      <stop offset="20%" stop-color="#FF8A3D" />
      <stop offset="55%" stop-color="#F26A1B" />
      <stop offset="85%" stop-color="#D94F35" />
      <stop offset="100%" stop-color="#A63215" />
    </linearGradient>

    <linearGradient id="orangeCrown" x1="200" y1="90" x2="295" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC08A" />
      <stop offset="35%" stop-color="#FF8A3D" />
      <stop offset="75%" stop-color="#F26A1B" />
      <stop offset="100%" stop-color="#C84B00" />
    </linearGradient>

    <linearGradient id="crescentArc" x1="265" y1="85" x2="390" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A4D" />
      <stop offset="22%" stop-color="#FFC999" />
      <stop offset="40%" stop-color="#FF8A3D" />
      <stop offset="75%" stop-color="#F26A1B" />
      <stop offset="100%" stop-color="#A63215" />
    </linearGradient>

    <!-- Subtle depth shadow (kept light so it works on cream backgrounds) -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 1. Outer right orange crescent -->
    <path d="M 262 88
         C 365 86, 444 162, 442 264
         C 440 328, 405 380, 350 408
         C 394 376, 426 324, 427 262
         C 428 166, 355 96, 262 88 Z" fill="url(#crescentArc)" />

    <!-- 2. Crown (3 tiers) -->
    <path d="M 241 92
         C 245 103, 253 111, 262 117
         C 248 113, 234 113, 221 118
         C 229 111, 237 103, 241 92 Z" fill="url(#orangeCrown)" />
    <path d="M 206 134
         C 225 117, 256 116, 279 131
         C 257 126, 228 127, 206 134 Z" fill="url(#orangeCrown)" />
    <path d="M 212 145
         C 238 131, 272 134, 300 160
         C 272 148, 238 144, 212 145 Z" fill="url(#orangeCrown)" />

    <!-- 3. Face details: tilak, bindu, eye, trunk -->
    <path d="M 277 167
         L 285 189
         C 287 194, 294 193, 293 187
         L 287 165
         L 291 164
         L 298 187
         C 300 196, 285 199, 281 190
         L 273 168 Z" fill="url(#orangeCrown)" />
    <path d="M 281 166 L 288 186 L 291 185 L 284 165 Z" fill="url(#orangeCrown)" />
    <circle cx="293" cy="201" r="3.2" fill="url(#orangeCrown)" />

    <!-- Eye (black) -->
    <path d="M 271 203
         C 283 204, 293 210, 298 220
         C 291 213, 282 208, 271 203 Z" fill="url(#blackMain)" />
    <path d="M 275 210
         C 279 217, 287 220, 294 218
         C 288 216, 282 214, 275 210 Z" fill="url(#blackBevel)" />

    <!-- Trunk -->
    <path d="M 306 164
         C 332 180, 340 205, 329 233
         C 323 249, 329 261, 342 261
         C 346 261, 349 258, 350 252
         C 352 261, 345 268, 333 268
         C 314 268, 306 251, 313 227
         C 319 204, 318 181, 306 164 Z" fill="url(#orangeRibbon)" />
    <path d="M 332 266
         C 343 267, 351 261, 350 250
         C 348 258, 342 263, 332 266 Z" fill="url(#blackMain)" />

    <!-- 4. Bottom-left wedge -->
    <polygon points="145,321 172,321 107,396" fill="url(#blackWedgeLight)" />
    <polygon points="172,321 198,321 107,396" fill="url(#blackWedgeDark)" />

    <!-- 5. Orange ribbon of the S -->
    <path d="M 137 210
         C 104 233, 86 268, 98 296
         C 109 321, 145 322, 198 323
         C 248 325, 284 333, 284 358
         C 284 377, 258 389, 224 390
         C 272 390, 305 375, 305 347
         C 305 314, 266 299, 206 293
         C 150 287, 114 274, 115 245
         C 115 231, 123 220, 137 210 Z" fill="url(#orangeRibbon)" />

    <!-- 6. Brow crease -->
    <path d="M 207 183
         C 231 186, 247 197, 256 215
         C 243 200, 227 191, 207 183 Z" fill="url(#blackMain)" />

    <!-- 7. Main black S -->
    <path d="M 263 220
         C 266 177, 236 147, 196 149
         C 160 150, 138 171, 141 198
         C 145 231, 184 249, 242 269
         C 302 290, 344 313, 343 354
         C 342 382, 312 400, 254 401
         C 296 395, 322 377, 322 351
         C 322 318, 284 299, 226 279
         C 168 259, 135 236, 138 198
         C 141 166, 168 152, 200 154
         C 234 156, 257 182, 263 220 Z" fill="url(#blackBevel)" />

    <path d="M 263 220
         C 265 175, 236 146, 196 148
         C 158 150, 136 172, 139 200
         C 143 234, 182 252, 240 272
         C 300 292, 340 314, 339 353
         C 338 380, 310 397, 256 400
         C 295 392, 316 375, 316 351
         C 316 320, 280 301, 222 281
         C 166 261, 140 239, 142 202
         C 144 176, 166 164, 194 166
         C 226 168, 250 189, 263 220 Z" fill="url(#blackMain)" />

    <!-- Lower loop and base bar -->
    <path d="M 245 274
         C 295 292, 324 316, 322 350
         C 320 378, 288 391, 240 391
         L 135 391
         L 158 371
         L 238 371
         C 268 371, 286 362, 286 347
         C 286 330, 265 316, 225 301
         Z" fill="url(#blackMain)" />

    <path d="M 135 391 L 158 371 L 165 376 L 146 391 Z" fill="url(#blackBevel)" />
  </g>
</svg>